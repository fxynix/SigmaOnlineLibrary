services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_MODE=always
      - SPRING_DATASOURCE_URL=jdbc:postgresql://dpg-d6nepti4d50c73dgm6t0-a.frankfurt-postgres.render.com/database2_6fc6
      - SPRING_DATASOURCE_USERNAME=database2_6fc6_user
      - SPRING_DATASOURCE_PASSWORD=NOoDjGbnMqWHfxsFQ8DLHzvIxbz2Lawf
    depends_on:
      db:
        condition: service_started
    networks:
      - library-network


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - library-network


  db:
    image: postgres:17
    container_name: library-db
    environment:
      POSTGRES_DB: database2_6fc6
      POSTGRES_USER: database2_6fc6_user
      POSTGRES_PASSWORD: NOoDjGbnMqWHfxsFQ8DLHzvIxbz2Lawf
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - library-network


networks:
  library-network:
    driver: bridge

volumes:
  db-data: